<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P and A App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="login-container" class="card">
        <h2>🔒 P and A Login</h2>
        <p>Para sa inyong dalawa lang ito!</p>
        <input type="text" id="login-username" placeholder="Pangalan (Prince / Angelica)" /><br>
        <input type="password" id="login-password" placeholder="Password..." /><br>
        <button id="login-btn">Mag-login</button>
        <p id="error-msg" style="color: red; font-size: 14px;"></p>
    </div>

    <!-- CHAT SCREEN (Nakatago muna hangga't hindi nagre-login) -->
    <div id="chat-container" class="chat-container" style="display: none;">
        <header>
            <h2>❤️ P and A Chat ❤️</h2>
        </header>
        
        <div id="chat-messages"></div>

        <div class="chat-input-area">
            <input type="text" id="message-input" placeholder="Mag-type ng mensahe..." />
            <input type="file" id="image-input" accept="image/*" style="display: none;" />
            <button onclick="document.getElementById('image-input').click()">📷</button>
            <button id="send-btn">Ipadala</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        let loggedInUser = '';

        document.getElementById('login-btn').addEventListener('click', async () => {
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;

            const response = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();
            if (data.success) {
                loggedInUser = username;
                document.getElementById('login-container').style.display = 'none';
                document.getElementById('chat-container').style.display = 'flex';
                initChat();
            } else {
                document.getElementById('error-msg').innerText = data.message;
            }
        });

        function initChat() {
            const socket = io();
            const sendBtn = document.getElementById('send-btn');
            const messageInput = document.getElementById('message-input');
            const imageInput = document.getElementById('image-input');
            const chatMessages = document.getElementById('chat-messages');

            sendBtn.addEventListener('click', () => {
                const message = messageInput.value;
                const imageFile = imageInput.files[0];

                if (imageFile) {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        socket.emit('chat_message', { sender: loggedInUser, message, image: e.target.result });
                        imageInput.value = '';
                        messageInput.value = '';
                    };
                    reader.readAsDataURL(imageFile);
                } else if (message.trim() !== '') {
                    socket.emit('chat_message', { sender: loggedInUser, message, image: null });
                    messageInput.value = '';
                }
            });

            socket.on('chat_message', (data) => {
                const messageDiv = document.createElement('div');
                messageDiv.classList.add('message');
                
                let content = `<strong>${data.sender}:</strong> ${data.message || ''}`;
                if (data.image) {
                    content += `<br><img src="${data.image}" style="max-width: 200px; border-radius: 10px; margin-top: 5px;" />`;
                }

                messageDiv.innerHTML = content;
                chatMessages.appendChild(messageDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            });
        }
    </script>
</body>
</html>
